<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <main>
        <div id="error"></div>
        <a href="index.html">Back to courses</a>
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <button id="change-images-btn">Change course images</button>
        </div>
        <dialog id="course-picker">
            <h2>Select course to change</h2>
            <div id="course-picker-list"></div>
            <button id="course-picker-cancel">Cancel</button>
        </dialog>
        <div id="card-grid" class="card-grid"></div>
        <input type="file" id="image-input" accept="image/*" aria-label="Upload course image" hidden>
    </main>
    <script src="dashboard.js"></script>
</body>

</html>
