            <li>
                <a href="courses.html" class="w-full flex items-center justify-center md:justify-start gap-2 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-900 font-medium py-1.5 px-3 rounded">

    <main id="main-content" class="flex-1 p-6 flex flex-col min-w-0">
        <div id="error" role="alert"></div>
        <a href="index.html">Back to courses</a>
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <button id="change-images-btn">Change course images</button>
        </div>
        <dialog id="course-picker">
            <h2>Select course to change</h2>
            <div id="course-picker-list"></div>
            <button id="course-picker-cancel">Cancel</button>
        </dialog>
        <div id="card-grid" class="card-grid"></div>
        <input type="file" id="image-input" accept="image/*" aria-label="Upload course image" hidden>
    </main>
    <script src="dashboard.js"></script>
</body>

</html>
