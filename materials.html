        <div class="text-white font-bold text-lg md:mb-2 px-2">Canvas</div>

        <ul class="flex flex-row md:flex-col flex-wrap gap-2 w-auto md:w-full list-none m-0 p-0">
            <!-- Home / Index -->
            <li>
                <a href="index.html" class="w-full flex items-center justify-center md:justify-start gap-2 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-900 font-medium py-1.5 px-3 rounded">
                    <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="w-5 h-5 flex-shrink-0">

                    </svg>
                    <span>Home</span>
                </a>
            </li>

            <!-- Dashboard -->
            <li>
                <a href="dashboard.html" class="w-full flex items-center justify-center md:justify-start gap-2 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-900 font-medium py-1.5 px-3 rounded">
                    <svg viewBox="0 0 280 200" fill="currentColor" aria-hidden="true" focusable="false" class="w-5 h-4 flex-shrink-0">
                        <path d="M273.09,180.75H197.47V164.47h62.62A122.16,122.16,0,1,0,17.85,142a124,124,0,0,0,2,22.51H90.18v16.29H6.89l-1.5-6.22A138.51,138.51,0,0,1,1.57,142C1.57,65.64,63.67,3.53,140,3.53S278.43,65.64,278.43,142a137.67,137.67,0,0,1-3.84,32.57ZM66.49,87.63,50.24,71.38,61.75,59.86,78,76.12Zm147,0L202,76.12l16.25-16.25,11.51,11.51ZM131.85,53.82v-23h16.29v23Zm15.63,142.3a31.71,31.71,0,0,1-28-16.81c-6.4-12.08-15.73-72.29-17.54-84.25a8.15,8.15,0,0,1,13.58-7.2c8.88,8.21,53.48,49.72,59.88,61.81a31.61,31.61,0,0,1-27.9,46.45ZM121.81,116.2c4.17,24.56,9.23,50.21,12,55.49A15.35,15.35,0,1,0,161,157.3C158.18,152,139.79,133.44,121.81,116.2Z"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- Courses -->
            <li>
                <a href="courses.html" class="w-full flex items-center justify-center md:justify-start gap-2 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-900 font-medium py-1.5 px-3 rounded">
                    <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="w-5 h-5 flex-shrink-0">

                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <line x1="9" y1="4" x2="9" y2="20"></line>
                    </svg>
                    <span>Courses</span>
                </a>
            </li>

            <!-- Materials -->
            <li>
                <a href="materials.html" aria-current="page" class="colorDynamicButton w-full flex items-center justify-center md:justify-start gap-2 bg-blue-700 text-white font-bold border-l-4 border-white focus:outline-none focus:ring-2 focus:ring-blue-300 py-1.5 px-3 rounded">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="w-5 h-5 flex-shrink-0">

                    </svg>
                    <span>Materials</span>
                </a>
            </li>

            <!-- Settings -->
            <li>
                <a href="settings.html" class="w-full flex items-center justify-center md:justify-start gap-2 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-900 font-medium py-1.5 px-3 rounded">
                    <svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="w-5 h-5 flex-shrink-0">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

                </a>
            </li>
        </ul>
    </nav>

    <main id="main-content" class="flex-1 p-6 flex flex-col min-w-0 colorDynamicText">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Course Materials</h1>
            <p class="text-gray-700 text-sm mt-1">Review required and optional textbooks by course shelf, check off owned copies, or open external bookstore listings.</p>
        </div>

        <section aria-label="Filter and search materials" class="mb-6 p-4 bg-gray-100 border border-gray-300 rounded-lg flex flex-wrap items-end gap-4">
            <div class="flex-1 min-w-[220px]">
                <label for="material-search" class="block text-sm font-bold text-gray-900 mb-1">Search Books</label>
                <input id="material-search" type="search" placeholder='Hint: Try "Kurose" or "9780135928790"'
                       class="w-full px-3 py-1.5 bg-white border border-gray-400 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-700">
            </div>

            <div class="min-w-[180px]">
                <label for="course-filter" class="block text-sm font-bold text-gray-900 mb-1">Course Shelf</label>
                <select id="course-filter" class="w-full px-3 py-1.5 bg-white border border-gray-400 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-700">
                    <option value="all">All Courses</option>
                </select>
            </div>

            <div class="flex items-center gap-4 pb-1.5">
                <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-900">
                    <input id="required-only-toggle" type="checkbox" class="w-4 h-4 accent-blue-700 focus:ring-2 focus:ring-blue-700">
                    <span>Required only</span>
                </label>

                <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-900">
                    <input id="unpurchased-only-toggle" type="checkbox" class="w-4 h-4 accent-blue-700 focus:ring-2 focus:ring-blue-700">
                    <span>Unpurchased only</span>
                </label>
            </div>
        </section>

        <!-- Live region announces loading completion, filter results, errors -->
        <div id="materials-container" aria-live="polite" class="flex flex-col w-full">
            <p class="text-gray-700 font-medium">Loading materials...</p>
        </div>
    </main>

    <!-- Undo Banner -->
    <div id="toast-region" aria-live="assertive" class="fixed bottom-4 right-4 z-50"></div>

    <!-- Book Card Template -->
    <template id="book-template">
        <article class="book-card w-full sm:w-[410px] max-w-full border border-gray-300 rounded-lg p-4 bg-gray-50 hover:shadow-md transition-shadow flex flex-col sm:flex-row gap-4">

            <div class="w-32 flex flex-col items-center gap-2 flex-shrink-0">
                <img class="book-cover w-full h-48 rounded shadow-sm object-cover border border-gray-300" alt="">
                <div class="button-container w-full"></div>
                <span class="store-hint text-[11px] text-gray-700 text-center leading-tight"></span>
            </div>

            <div class="flex-1 flex flex-col justify-between gap-2 min-w-0">
                <div class="flex flex-col gap-1">
                    <h3 class="book-title text-lg font-bold text-gray-900 leading-tight"></h3>
                    <p class="book-author text-gray-800 text-sm"></p>
                    <p class="book-edition text-gray-800 text-sm"></p>
                    <p class="book-isbn text-gray-800 text-sm"></p>
                </div>

                <div class="flex flex-col gap-2 pt-2 border-t border-gray-200">
                    <div class="badge-container flex flex-wrap items-center gap-2"></div>

                    <label class="purchased-label inline-flex items-center gap-2 px-2.5 py-1.5 rounded border border-gray-300 bg-white hover:bg-gray-100 cursor-pointer text-sm font-semibold text-gray-900 w-max focus-within:ring-2 focus-within:ring-blue-700">
                        <input type="checkbox" class="purchased-checkbox w-4 h-4 accent-green-700">
                        <span class="purchased-text">Mark as Purchased</span>
                    </label>
                </div>
            </div>

        </article>
    </template>

    <script src="theme.js"></script>
    <script src="materials_script.js"></script>
</body>
</html>
